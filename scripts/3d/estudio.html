<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Estúdio 3D · Elã</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #EFEBE4; color: #1F2622; padding: 20px; }
    .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
    figure { margin: 0; background: repeating-conic-gradient(#e4dfd6 0 25%, #f3efe8 0 50%) 0 0 / 20px 20px; border-radius: 16px; overflow: hidden; }
    figure img { width: 100%; display: block; }
    figcaption { padding: 8px 12px; background: #fff; }
    button { font: inherit; padding: 10px 18px; border-radius: 99px; border: 0; background: #1F2622; color: #fff; cursor: pointer; }
  </style>
  <script type="importmap">{ "imports": { "three": "/three.module.js" } }</script>
</head>
<body>
  <h1>Estúdio 3D · Elã</h1>
  <p>Cada objeto é renderizado com fundo transparente (o xadrez mostra a transparência). <button id="salvar">Salvar todos em fotos-originais/3d</button> <span id="status"></span></p>
  <div class="grade" id="grade"></div>
  <script type="module" src="/estudio.js"></script>
</body>
</html>
